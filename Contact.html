    <section id="contact" class="contact-section">
        <h2>Əlaqə</h2>
        <div class="contact-container">
            <div class="contact-info">
                <h3>Bizimlə Əlaqə Qurun</h3>
                <p>Brad Pitt fan saytına xoş gəlmisiniz! Əlaqə saxlamaq və ya yeniliklərdən xəbərdar olmaq üçün sosial media hesablarımızla tanış olun.</p>
                <ul class="contact-list" aria-label="Əlaqə məlumatları">
                    <li>
                        <strong></strong>
                        <a href="mailto:mcidnbizad5@gmail.com" aria-label="E-poçt ilə əlaqə"><button>E-poçt:</button></a>
                    </li>
                    <br>
                    <li>
                        <strong>Sosial Media:</strong>
                        <br><br>
                        <div class="social-links">
                            <a href="https://x.com/home" target="_blank" aria-label="Brad Pitt-in X hesabı"><button>X</button></a>
                            <br><br>
                            <a href="https://www.instagram.com/mecid12315/" target="_blank" aria-label="Brad Pitt-in Instagram hesabı"><button>Instagram</button></a>
                            <br><br>
                            <a href="https://www.facebook.com/profile.php?id=100090637385825" target="_blank" aria-label="Brad Pitt-in Facebook hesabı"><button>Facebook</button></a>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="contact-form">
                <h3>Mesaj Göndərin</h3>
                <form aria-label="Əlaqə forması">
                    <div class="form-group">
                        <label for="name">Adınız:</label>
                        <input type="text" id="name" name="name" placeholder="Adınızı daxil edin" required>
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="email">E-poçt:</label>
                        <input type="email" id="email" name="email" placeholder="E-poçt ünvanınızı daxil edin" required>
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="message">Mesajınız:</label>
                        <textarea id="message" name="message" placeholder="Mesajınızı yazın" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn" disabled aria-label="Mesaj göndər">Göndər</button>
                    <p class="form-note"></p>
                </form>
            </div>
        </div>
    </section>
